data:
  splits_subdir: v3

model:
  family: whisper
  checkpoint: openai/whisper-large-v3-turbo
  language: fa
  task: transcribe
  peft: {enabled: true, method: lora, use_dora: true, rank: 32, alpha: 64, target_modules: all-linear}
experiment:
  data_budgets: [0, 5, 10, 25, 50]
  modes: [zero_shot, lora]
training:
  seed: 42
  bf16: true
  gradient_checkpointing: true
  optim: adamw_bnb_8bit
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4   # LoRA needs higher LR than full FT; sweep {3e-4, 1e-3}
  warmup_steps: 100
  num_epochs: 3
