model:
  family: w2vbert
  checkpoint: facebook/w2v-bert-2.0   # Wav2Vec2BertForCTC; trained from pretrained base (no community-FT warm start => no CV contamination)
  decoder: ctc
  language: fa

data:
  splits_subdir: v3        # leakage-free splits, see scripts/make_clean_splits.py

output:
  run_tag: ep6

experiment:
  data_budgets: [0, 5, 10, 25, 50]
  modes:
    - zero_shot
    - finetune_ctc

training:
  seed: 42
  bf16: true
  gradient_checkpointing: true
  learning_rate: 5.0e-5
  warmup_steps: 50
  num_epochs: 6
  max_epochs_this_run: 3   # segment length (laptop-burn policy: <~45 min per run)
  resume: true            # 2nd segment
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  optim: adamw_bnb_8bit
  gradient_accumulation_steps: 8
  # SpecAugment + regularisation (recommended w2v-BERT 2.0 CTC recipe)
  mask_time_prob: 0.05
  mask_feature_prob: 0.05
  layerdrop: 0.0
  ctc_zero_infinity: true
